name: PySATL CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed, review_requested]
  release:
    types: [published]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
            sudo apt-get update
            sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install Poetry
        run: pip install poetry==2.1.1

      - name: Install dependencies with Poetry
        run: poetry install --with dev

      - name: Run Ruff lint
        run: poetry run ruff check src/pysatl_experiment tests --output-format=github

      - name: Check formatting with Ruff
        run: poetry run ruff format --check src/pysatl_experiment tests

      - name: Run tests
        run: poetry run pytest --random-order tests

      - name: Check types
        run: |
          poetry run mypy src tests

      - name: Tests with Coveralls
        if: matrix.python-version == '3.12'
        run: |
          poetry run pytest --random-order --cov=src/pysatl_experiment --cov-config=.coveragerc

      - name: Coveralls
        if: matrix.python-version == '3.12'
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.coverallsToken }}
        run: poetry run coveralls || true

      - name: Remove poetry.lock before checking for changes
        run: rm -f poetry.lock

      - name: Check for repository changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Repository is dirty, changes detected:"
            git status
            git diff
            exit 1
          else
            echo "Repository is clean, no changes detected."
          fi
  build:
    name: "Build"
    needs: [ build-linux, pre-commit ]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build distribution
        run: pip install poetry==2.1.1

      - name: Install dynamic versioning plugin
        run: poetry self add poetry-dynamic-versioning[plugin]

      - name: Build distribution
        run: poetry build

      - name: Show version
        run: poetry version

      - name: Upload artifacts 📦
        uses: actions/upload-artifact@v7
        with:
          name: pysatl-experiment-build
          path: |
            dist
          retention-days: 10
  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
  deploy-pypi:
    name: "Publish Python 🐍 distribution 📦 to PyPI"
    needs: [ build ]
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    environment:
      name: pypi
      url: https://pypi.org/p/pysatl-experiment
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifact  📦
        uses: actions/download-artifact@v8
        with:
          pattern: pysatl*-build
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
  deploy-testpypi:
    name: "Publish Python 🐍 distribution 📦 to Test PyPI"
    needs: [ build ]
    runs-on: ubuntu-22.04

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: testpypi
      url: https://test.pypi.org/project/pysatl-experiment/

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifact 📦
        uses: actions/download-artifact@v8
        with:
          pattern: pysatl*-build
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  docker-push:
    name: "Docker 🐳 push edge/main tags"
    needs: [ build-linux, pre-commit ]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # poetry.lock is gitignored, so the Docker build context has no lock file
      # after checkout. Generate it before `docker build` (plain `poetry lock`
      # keeps existing pins; the --no-update flag was removed in Poetry 2.x).
      - name: Generate poetry.lock for the Docker build context
        run: |
          pip install poetry==2.1.1
          poetry lock

      - name: Resolve short commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pysatl-experiment:edge
            ${{ secrets.DOCKERHUB_USERNAME }}/pysatl-experiment:main-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-push-release:
    name: "Docker 🐳 push release tags"
    needs: [ build-linux, pre-commit ]
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Generate poetry.lock for the Docker build context
        run: |
          pip install poetry==2.1.1
          poetry lock

      - name: Resolve release tag (vX.Y.Z)
        run: echo "RELEASE_TAG=v${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pysatl-experiment:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pysatl-experiment:${{ env.RELEASE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
