# .readthedocs.yml
version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.12"
  jobs:
    # Docs dependencies live in [tool.poetry.group.docs] of pyproject.toml.
    # Install them directly from there (no requirements file to keep in sync).
    post_create_environment:
      - python -m pip install poetry==2.1.1
    post_install:
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH python -m poetry install --only docs --no-root

mkdocs:
  configuration: mkdocs.yml
